<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrulla Retro - Sorteo Mensual</title>
    <!-- Tailwind CSS para utilidades rápidas de diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        /* Estilos generales y fondo adaptable */
        body {
            background-color: #0f172a;
            background-image: url('fondo-retro.jpg');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
            background-attachment: fixed;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px 12px;
        }

        /* Contenedor central limitado a 800px para encajar en el centro limpio */
        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Logo con soporte transparente nativo */
        .header-logo {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto 15px auto;
            background: transparent;
            border: none;
        }

        /* Estilo para las tarjetas con leve opacidad para integrar el fondo */
        .card {
            background-color: rgba(30, 41, 59, 0.92);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .btn-primary {
            background-color: #ef4444;
            color: white;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 8px;
            transition: all 0.2s ease;
            width: 100%;
            display: block;
            text-align: center;
        }

        .btn-primary:hover {
            background-color: #dc2626;
            transform: translateY(-1px);
        }

        .badge {
            background-color: #334155;
            color: #94a3b8;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo PNG con transparencia -->
        <header class="text-center mb-6">
            <img src="logo.png" alt="Logo Patrulla Retro" class="header-logo">
            <h1 class="text-2xl font-bold tracking-wide text-red-500">SORTEO PATRULLA RETRO</h1>
        </header>

        <!-- Bloque Principal: Último Ganador -->
        <div class="card text-center" id="winner-card">
            <h2 class="text-xl font-bold mb-2 text-slate-300">Último Ganador Oficial</h2>
            <div id="latest-winner-display" class="py-4">
                <p class="text-slate-400">Cargando datos del último sorteo...</p>
            </div>
        </div>

        <!-- Bloque: Top Ganadores (Optimizado a 3 entradas) -->
        <div class="card">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-200">🏆 Más Victorias</h3>
                <span class="badge" id="top-count-badge">Top 3</span>
            </div>
            <ul id="top-winners-list" class="space-y-2">
                <!-- Se rellena dinámicamente -->
            </ul>
            <button id="toggle-top-btn" onclick="toggleTopWinners()" class="mt-3 text-xs text-slate-400 hover:text-white underline w-full text-center hidden">
                Mostrar todos
            </button>
        </div>

        <!-- Bloque: Historial de Sorteos (Optimizado a 3 entradas) -->
        <div class="card">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-200">📜 Historial Reciente</h3>
                <span class="badge">Últimos meses</span>
            </div>
            <ul id="history-list" class="space-y-2">
                <!-- Se rellena dinámicamente -->
            </ul>
            <button id="toggle-history-btn" onclick="toggleHistory()" class="mt-3 text-xs text-slate-400 hover:text-white underline w-full text-center hidden">
                Ver historial completo
            </button>
        </div>

        <!-- Panel de Administración (Desplegable / Oculto por defecto si prefieres) -->
        <div class="card border-slate-700">
            <h3 class="text-lg font-bold text-red-400 mb-3">🛠️ Panel de Administración</h3>
            <textarea id="participants-input" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-red-500 mb-3" placeholder="Pega aquí los nombres de los participantes (uno por línea)..."></textarea>
            
            <button onclick="realizarSorteo()" class="btn-primary">
                🎲 REALIZAR Y PUBLICAR SORTEO
            </button>
        </div>
    </div>

    <!-- Script de Firebase e Interacción -->
    <script>
        // Configuración de tu Firebase Realtime Database
        const firebaseConfig = {
            databaseURL: "https://TU-DATABASE-NAME.firebaseio.com" // Reemplaza por tu URL de Firebase
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Variables de estado local para toggles
        let allTopWinners = [];
        let showAllTop = false;
        let allHistory = [];
        let showAllHistory = false;

        // Cargar datos al iniciar
        window.addEventListener('DOMContentLoaded', () => {
            listenToData();
        });

        function listenToData() {
            db.ref('sorteos').on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                const list = Object.values(data).reverse(); // Ordenar del más reciente al más antiguo
                allHistory = list;
                
                renderLatestWinner(list[0]);
                renderHistory();
                renderTopWinners(list);
            });
        }

        // Renderizar tarjeta de ganador principal
        function renderLatestWinner(latest) {
            const container = document.getElementById('latest-winner-display');
            if (!latest) {
                container.innerHTML = `<p class="text-slate-500">No hay sorteos registrados.</p>`;
                return;
            }

            container.innerHTML = `
                <div class="text-3xl font-extrabold text-yellow-400 tracking-wide mb-1">
                    🎉 ¡Campeón! 🎉
                </div>
                <div class="text-2xl font-bold text-white mb-2">
                    ${latest.ganador}
                </div>
                <div class="text-xs text-slate-400">
                    Sorteo realizado el ${latest.fecha}
                </div>
            `;
        }

        // Renderizar Historial de Sorteos
        function renderHistory() {
            const container = document.getElementById('history-list');
            const toggleBtn = document.getElementById('toggle-history-btn');
            container.innerHTML = '';

            const itemsToDisplay = showAllHistory ? allHistory : allHistory.slice(0, 3);

            itemsToDisplay.forEach(item => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-slate-800/60 px-3 py-2 rounded text-sm';
                li.innerHTML = `
                    <span class="font-medium text-slate-200">${item.ganador}</span>
                    <span class="text-xs text-slate-400">${item.fecha}</span>
                `;
                container.appendChild(li);
            });

            if (allHistory.length > 3) {
                toggleBtn.classList.remove('hidden');
                toggleBtn.textContent = showAllHistory ? 'Ver menos' : `Ver historial completo (${allHistory.length})`;
            } else {
                toggleBtn.classList.add('hidden');
            }
        }

        function toggleHistory() {
            showAllHistory = !showAllHistory;
            renderHistory();
        }

        // Renderizar Top Ganadores
        function renderTopWinners(historyList) {
            const counts = {};
            historyList.forEach(item => {
                counts[item.ganador] = (counts[item.ganador] || 0) + 1;
            });

            allTopWinners = Object.entries(counts)
                .map(([name, count]) => ({ name, count }))
                .sort((a, b) => b.count - a.count);

            const container = document.getElementById('top-winners-list');
            const toggleBtn = document.getElementById('toggle-top-btn');
            container.innerHTML = '';

            const itemsToDisplay = showAllTop ? allTopWinners : allTopWinners.slice(0, 3);

            itemsToDisplay.forEach(item => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-slate-800/60 px-3 py-2 rounded text-sm';
                li.innerHTML = `
                    <span class="font-medium text-slate-200">${item.name}</span>
                    <span class="text-xs bg-red-950 text-red-300 font-bold px-2 py-0.5 rounded border border-red-800/50">${item.count} victorias</span>
                `;
                container.appendChild(li);
            });

            if (allTopWinners.length > 3) {
                toggleBtn.classList.remove('hidden');
                toggleBtn.textContent = showAllTop ? 'Ver menos' : `Mostrar todos (${allTopWinners.length})`;
            } else {
                toggleBtn.classList.add('hidden');
            }
        }

        function toggleTopWinners() {
            showAllTop = !showAllTop;
            renderTopWinners(allHistory);
        }

        // Función para ejecutar el sorteo
        function realizarSorteo() {
            const input = document.getElementById('participants-input').value.trim();
            if (!input) {
                alert('Por favor, introduce al menos un participante.');
                return;
            }

            const lista = input.split('\n').map(n => n.trim()).filter(n => n.length > 0);
            if (lista.length === 0) {
                alert('No se encontraron nombres válidos.');
                return;
            }

            // Elegir ganador al azar
            const ganador = lista[Math.floor(Math.random() * lista.length)];
            const fechaActual = new Date().toLocaleDateString('es-ES', {
                day: '2-digit',
                month: 'long',
                year: 'numeric'
            });

            const nuevoSorteo = {
                ganador: ganador,
                fecha: fechaActual,
                timestamp: Date.now()
            };

            // Guardar en Firebase Realtime Database
            db.ref('sorteos').push(nuevoSorteo, (error) => {
                if (error) {
                    alert('Error al guardar en la base de datos: ' + error.message);
                } else {
                    document.getElementById('participants-input').value = '';
                    alert(`¡Sorteo realizado con éxito!\nGanador: ${ganador}`);
                }
            });
        }
    </script>
</body>
</html>
