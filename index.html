<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteo HoF Patrulla Retro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 0 20px;
      background-color: #f4f4f9;
      color: #333;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      margin-bottom: 5px;
    }
    .subtitulo-mes {
      display: block;
      font-size: 0.75em;
      font-weight: normal;
      color: #555;
      margin-top: 5px;
    }
    section {
      background: #fff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .admin-panel {
      border: 2px dashed #007bff;
      background-color: #eef6ff;
    }
    label {
      font-weight: bold;
    }
    select, input, button {
      padding: 8px;
      margin: 5px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
      border: none;
    }
    button:hover {
      background-color: #0056b3;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>

  <!-- Encabezado Principal -->
  <header>
    <h1>
      🏆 Sorteo HoF Patrulla Retro<br>
      <span id="subtitulo-mes" class="subtitulo-mes">Mes de Enero</span>
    </h1>
  </header>

  <!-- Panel de Administración -->
  <section class="admin-panel">
    <h3>⚙️ Panel de Administración</h3>
    <div>
      <label for="select-mes">Cambiar Mes del Sorteo:</label><br>
      <select id="select-mes">
        <option value="Enero">Enero</option>
        <option value="Febrero">Febrero</option>
        <option value="Marzo">Marzo</option>
        <option value="Abril">Abril</option>
        <option value="Mayo">Mayo</option>
        <option value="Junio">Junio</option>
        <option value="Julio">Julio</option>
        <option value="Agosto">Agosto</option>
        <option value="Septiembre">Septiembre</option>
        <option value="Octubre">Octubre</option>
        <option value="Noviembre">Noviembre</option>
        <option value="Diciembre">Diciembre</option>
      </select>
      <button onclick="guardarMes()">Actualizar Mes</button>
    </div>
  </section>

  <!-- Sección Hall of Fame -->
  <section>
    <h2>🥇 Hall of Fame 🥇</h2>
    <ul id="lista-hall-of-fame">
      <!-- Ejemplo de lista de ganadores/victorias -->
      <li><strong>@Usuario1</strong> — 3 victorias</li>
      <li><strong>@Usuario2</strong> — 1 victoria</li>
    </ul>
  </section>

  <script>
    // Función para actualizar el subtítulo del mes en la pantalla
    function actualizarSubtituloMes(mes) {
      const subtituloElem = document.getElementById('subtitulo-mes');
      if (subtituloElem) {
        subtituloElem.textContent = `Mes de ${mes}`;
      }
    }

    // Evento del botón del Panel de Administración
    function guardarMes() {
      const selector = document.getElementById('select-mes');
      const mesSeleccionado = selector.value;
      
      // Actualizar vista
      actualizarSubtituloMes(mesSeleccionado);
      
      // Si usas Firebase u otra base de datos, aquí ejecutas la actualización:
      // firebase.database().ref('config/mesActual').set(mesSeleccionado);
    }
  </script>

</body>
</html>
