    function calcularYMostrarProbabilidades() {
        const rawLinesStr = document.getElementById('listInput').value.trim();
        const modalListEl = document.getElementById('participantsListModal');
        if (!modalListEl) return;
        modalListEl.innerHTML = '';
        if (!rawLinesStr) {
            modalListEl.innerHTML = '<li class="custom-item" style="justify-content: center; color: var(--muted);">No hay participantes cargados actualmente.</li>';
            return;
        }
        const rawLines = rawLinesStr.split('\n');
        let boletosPorUsuario = {};
        let totalBoletosValidos = 0;
        rawLines.forEach(function(line) {
            let lineaLimpia = line.trim();
            if (!lineaLimpia) return;
            const matchUser = lineaLimpia.match(/@[\w_]+/);
            if (matchUser) {
                let user = matchUser[0];
                let numBoletoMatch = lineaLimpia.match(/^(\d+)/);
                let numeroBoleto = numBoletoMatch ? numBoletoMatch[1] : (boletosPorUsuario[user] ? boletosPorUsuario[user].length + 1 : 1);
                if (!boletosPorUsuario[user]) boletosPorUsuario[user] = [];
                boletosPorUsuario[user].push(numeroBoleto);
                totalBoletosValidos++;
            }
        });
        if (totalBoletosValidos === 0) {
            modalListEl.innerHTML = '<li class="custom-item" style="justify-content: center; color: var(--muted);">No se encontraron participantes válidos.</li>';
            return;
        }
        let listaParticipantes = Object.keys(boletosPorUsuario).map(user => {
            let listaB = boletosPorUsuario[user];
            let probabilidad = (listaB.length / totalBoletosValidos) * 100;
            return { user: user, boletos: listaB, count: listaB.length, prob: probabilidad };
        });
        listaParticipantes.sort((a, b) => b.count - a.count);
        listaParticipantes.forEach(p => {
            const li = document.createElement('li');
            li.className = 'custom-item';
            let porcentajeStr = p.prob.toFixed(3) + "%";
            li.innerHTML = `<div class="custom-item-text">
                                <strong>${p.user}</strong> <span style="font-size:0.75rem; color:var(--muted);">(${p.count} ${p.count === 1 ? 'boleto' : 'boletos'})</span>
                                <div style="font-size: 0.75rem; color: #aaa; margin-top: 2px; word-break: break-all;">Números: ${p.boletos.join(', ')}</div>
                           </div>` +
                           `<span style="color: var(--gold); font-family: monospace; font-size: 0.9rem; white-space: nowrap;">${porcentajeStr}</span>`;
            modalListEl.appendChild(li);
        });
    }

    function parseCSVLine(linea) {
        let resultado = [];
        let celda = '';
        let enComillas = false;
        for (let i = 0; i < linea.length; i++) {
            let char = linea[i];
            if (char === '"') enComillas = !enComillas;
            else if (char === ',' && !enComillas) {
                resultado.push(celda.trim());
                celda = '';
            } else celda += char;
        }
        resultado.push(celda.trim());
        return resultado;
    }

    function normalizarTexto(txt) {
        if (!txt) return "";
        return txt.toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    }

    async function obtenerJuegosDesdeSheets() {
        if (cacheJuegosSheets && (Date.now() - ultimaCargaSheets < 30000)) return cacheJuegosSheets;
        try {
            const res = await fetch(GOOGLE_SHEETS_CSV_URL + "&t=" + Date.now());
            if (!res.ok) throw new Error("Error al leer Sheets");
            const text = await res.text();
            const lineas = text.split('\n').filter(l => l.trim().length > 0);
            let juegos = [];
            lineas.forEach(lineaRaw => {
                const columnas = parseCSVLine(lineaRaw);
                const titulo = columnas[0] ? columnas[0].replace(/^"+|"+$/g, '').trim() : '';
                const fecha = columnas[1] ? columnas[1].replace(/^"+|"+$/g, '').trim() : '';
                if (titulo) juegos.push({ titulo: titulo, fecha: fecha });
            });
            cacheJuegosSheets = juegos;
            ultimaCargaSheets = Date.now();
            return cacheJuegosSheets;
        } catch (e) {
            console.error("Error leyendo Google Sheets:", e);
            return cacheJuegosSheets || [];
        }
    }

    async function comprobarJuegoEnSheets() {
        const inputEl = document.getElementById('gameSearchInput');
        const dropdown = document.getElementById('customSuggestions');
        const resBox = document.getElementById('searchResult');
        const query = inputEl.value.trim();
        const queryNorm = normalizarTexto(query);
        if (queryNorm.length < 4) {
            dropdown.innerHTML = '';
            dropdown.style.display = 'none';
            resBox.style.display = 'none';
            return;
        }
        const listaJuegos = await obtenerJuegosDesdeSheets();
        let coincidenciaExacta = listaJuegos.find(j => normalizarTexto(j.titulo) === queryNorm);
        const juegosFiltrados = listaJuegos.filter(j => normalizarTexto(j.titulo).includes(queryNorm));
        dropdown.innerHTML = '';
        if (juegosFiltrados.length > 0 && !coincidenciaExacta) {
            juegosFiltrados.slice(0, 15).forEach(j => {
                const divItem = document.createElement('div');
                divItem.className = 'suggestion-item';
                divItem.innerHTML = `<div>${j.titulo}</div>` + (j.fecha ? `<span class="suggestion-date">Jugado en: ${j.fecha}</span>` : '');
                divItem.onmousedown = function(e) {
                    e.preventDefault();
                    inputEl.value = j.titulo;
                    dropdown.style.display = 'none';
                    comprobarJuegoEnSheets();
                };
                dropdown.appendChild(divItem);
            });
            dropdown.style.display = 'block';
        } else {
            dropdown.style.display = 'none';
        }
        resBox.style.display = 'block';
        resBox.className = 'search-result-box';
        if (coincidenciaExacta) {
            resBox.className = 'search-result-box result-found';
            let txtFecha = coincidenciaExacta.fecha ? ` - Jugado en: ${coincidenciaExacta.fecha}` : '';
            resBox.innerHTML = `❌ <b>"${coincidenciaExacta.titulo}"</b> ya ha sido seleccionado antes.${txtFecha}`;
        } else {
            resBox.className = 'search-result-box result-not-found';
            resBox.innerHTML = `✅ <b>"${query}"</b> no aparece como jugado exactamente con ese nombre.<br><span style="font-weight:normal; font-size:0.75rem;">(Revisa las opciones del desplegable para confirmar el título completo)</span>`;
        }
    }

    document.addEventListener('click', function(e) {

    function activarBusquedaVoz() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const micBtn = document.getElementById('micBtn');
        const inputEl = document.getElementById('gameSearchInput');
        if (!SpeechRecognition) {
            alert("Lo siento, tu navegador no soporta la búsqueda por voz.");
            return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        recognition.onstart = function() {
            micBtn.classList.add('listening');
            micBtn.title = "Escuchando voz...";
        };
        recognition.onresult = function(event) {
            const speechResult = event.results[0][0].transcript;
            inputEl.value = speechResult;
            comprobarJuegoInmediato(speechResult);
        };
        recognition.onerror = function(event) {
            console.error("Error en reconocimiento de voz:", event.error);
        };
        recognition.onend = function() {
            micBtn.classList.remove('listening');
            micBtn.title = "Búsqueda por voz";
        };
        recognition.start();
    }

    function crearBackupManual() {
        const ahora = new Date();
        const horaTag = `${String(ahora.getHours()).padStart(2,'0')}${String(ahora.getMinutes()).padStart(2,'0')}`;
        const clave = `${ahora.getFullYear()}-${String(ahora.getMonth() + 1).padStart(2, '0')}-${String(ahora.getDate()).padStart(2, '0')}_${horaTag}`;
        realizarCopiaEnFirebase(clave, "Copia Manual", true);

    function realizarCopiaEnFirebase(clave, etiqueta, notificar = false) {
        Promise.all([
            db.ref('historial_ganadores').once('value'),
            db.ref('sorteo_actual').once('value'),
            db.ref('mes_sorteo').once('value')
        ]).then(function(results) {
            const backupPayload = {
                fechaCopia: new Date().toLocaleString('es-ES'),
                etiqueta: etiqueta,
                historial_ganadores: results[0].val() || null,
                sorteo_actual: results[1].val() || null,
                mes_sorteo: results[2].val() || null
            };
            db.ref('backups/' + clave).set(backupPayload).then(function() {
                if (notificar) alert("✅ Copia de seguridad guardada con éxito bajo la clave: " + clave);
            }).catch(function(err) {
                alert("❌ No se pudo guardar el backup.");
            });
        });
    }

    function cargarListaBackups() {
        db.ref('backups').on('value', function(snapshot) {
            const select = document.getElementById('backupSelect');
            select.innerHTML = '<option value="">-- Selecciona una copia para restaurar o borrar --</option>';
            const backups = snapshot.val();
            if (!backups) return;
            Object.keys(backups).reverse().forEach(function(key) {
                const item = backups[key];
                const option = document.createElement('option');
                option.value = key;
                option.innerText = `${key} | ${item.etiqueta || 'Sin nombre'} (${item.fechaCopia || 'Fecha desc.'})`;
                select.appendChild(option);
            });
        });
    }

    function restaurarBackupSeleccionado() {
        const clave = document.getElementById('backupSelect').value;
        if (!clave) {
            alert("Por favor, selecciona una copia de seguridad del desplegable.");
            return;
        }
        if (confirm(`⚠️ ¿Estás seguro de RESTAURAR la copia "${clave}"?\n\nEsto sobrescribirá los datos con los guardados en ese momento.`)) {
            db.ref('backups/' + clave).once('value', function(snapshot) {
                const data = snapshot.val();
                if (!data) {
                    alert("Error al leer la copia de seguridad.");
                    return;
                }
                db.ref('historial_ganadores').set(data.historial_ganadores || null);
                db.ref('sorteo_actual').set(data.sorteo_actual || null);
                db.ref('mes_sorteo').set(data.mes_sorteo || null).then(function() {
                    alert("🎉 ¡Datos restaurados correctamente desde la copia " + clave + "!");
                });
            });
        }
    }

    function borrarBackupSeleccionado() {
        const clave = document.getElementById('backupSelect').value;
        if (!clave) {
            alert("Por favor, selecciona primero una copia del desplegable.");
            return;
        }
        const select = document.getElementById('backupSelect');
        const textoSeleccionado = select.options[select.selectedIndex].text;
        if (confirm(`⚠️ ¿Estás seguro de que deseas ELIMINAR permanentemente la copia de seguridad?\n\n"${textoSeleccionado}"`)) {
            db.ref('backups/' + clave).remove().then(function() {
                alert("🗑️ Copia de seguridad eliminada con éxito.");
            });
        }
    }

    function descargarBackupJSON() {
        Promise.all([
            db.ref('historial_ganadores').once('value'),
            db.ref('sorteo_actual').once('value'),
            db.ref('mes_sorteo').once('value')
        ]).then(function(results) {
            const backupData = {
                historial_ganadores: results[0].val() || null,
                sorteo_actual: results[1].val() || null,
                mes_sorteo: results[2].val() || null,
                exportadoEl: new Date().toLocaleString('es-ES')
            };
            const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_sorteo_patrulla_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });
    }

    function restaurarDesdeJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (confirm("⚠️ ¿Deseas restaurar la base de datos desde este archivo JSON local?")) {
                    if ('historial_ganadores' in data) db.ref('historial_ganadores').set(data.historial_ganadores);
                    if ('sorteo_actual' in data) db.ref('sorteo_actual').set(data.sorteo_actual);
                    if ('mes_sorteo' in data) db.ref('mes_sorteo').set(data.mes_sorteo);
                    alert("✅ ¡Copia de seguridad local restaurada con éxito!");
                }
            } catch (err) {
                alert("❌ El archivo no tiene un formato JSON válido.");
            }
        };
        reader.readAsText(file);
    }

        if (esManual) {
            originalText = btn.innerText;

            btn.disabled = true;
        }
        const timestamp = Date.now();
        const targetUrl = `https://t.me/s/retrojuegodelmes?before=${timestamp}`;
        const workerUrl = `${MI_CLOUDFLARE_WORKER}?url=${encodeURIComponent(targetUrl)}`;
        try {
            const response = await fetch(workerUrl, { cache: "no-store" });
            if (!response.ok) throw new Error(`Error Cloudflare: ${response.status}`);
            const htmlContent = await response.text();
            if (!htmlContent || !htmlContent.includes('tgme_widget_message_text')) throw new Error("Sin resultados.");
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlContent, 'text/html');
            const messages = doc.querySelectorAll('.tgme_widget_message_text');
            if (!messages || messages.length === 0) return;
            let ultimaListaEncontrada = "";
            const regexPatronLista = /\d+[\s-]*@[\w_]+/i;
            for (let i = messages.length - 1; i >= 0; i--) {
                let htmlTemp = messages[i].innerHTML.replace(/<br\s*[\/]?>/gi, "\n");
                let tempDiv = document.createElement("div");
                tempDiv.innerHTML = htmlTemp;
                let plainText = tempDiv.textContent || tempDiv.innerText || "";
                if (regexPatronLista.test(plainText)) {
                    const lineas = plainText.split('\n');
                    const lineasFiltradas = lineas.map(l => l.trim()).filter(l => regexPatronLista.test(l) || /PUNTO\s+EXTRA/i.test(l));
                    if (lineasFiltradas.length > 0) {
                        ultimaListaEncontrada = lineasFiltradas.join('\n');
                        break;
                    }
                }
            }
            if (ultimaListaEncontrada) {
                document.getElementById('listInput').value = ultimaListaEncontrada;
                guardarParticipantesFirebase();
                const totalCargados = ultimaListaEncontrada.split('\n').filter(l => regexPatronLista.test(l)).length;
                if (esManual) alert(`¡Éxito! Se ha cargado la última lista con ${totalCargados} participantes.`);
            } else if (esManual) {
                alert("No se encontró ningún mensaje reciente que contenga una lista.");
            }
        } catch (error) {
            console.error("Error Telegram:", error);
            if (esManual) alert("⚠️ No se pudo cargar la lista desde Telegram.");
        } finally {
            if (esManual) {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    }

    function actualizarEstadoRecreativa(targetTime) {
        const ahora = Date.now();
        const diff = targetTime - ahora;
        const slotStatus = document.getElementById('slotStatus');

        if (diff > 0) {
            mostrarRecreativa(true);
            if (diff <= 10 * 60 * 1000) {
                iniciarRodillos();
                const seg = Math.ceil(diff / 1000);
                slotStatus.innerText = '🎰 BUENA SUERTE, LA NECESITARÁS · ' +
                    String(Math.floor(seg/60)).padStart(2,'0') + ':' + String(seg%60).padStart(2,'0');
            } else {
                detenerRodillos();
                const dias = Math.floor(diff / (1000*60*60*24));
                const horas = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
                const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
                const segs = Math.floor((diff % (1000*60)) / 1000);
                let texto = '';
                if (dias > 0) texto += dias + 'd ';
                texto += String(horas).padStart(2,'0') + 'h ' +
                         String(mins).padStart(2,'0') + 'm ' +
                         String(segs).padStart(2,'0') + 's';
                slotStatus.innerText = '🎰 PRÓXIMO SORTEO · ' + texto;
            }
        } else {
            detenerRodillos();
            slotStatus.innerText = '⚡ ¡SORTEO EN MARCHA!';
            ejecutarTiradaProgramada();
        }
    }

            if (ahora >= targetTime) {

                timerInterval = null;

    }

        if (slotFinalizing) return;

        detenerRodillos();
        const reels = document.querySelectorAll('.slot-reel');
        const digitos = obtenerDigitosPremiados(ganador);
        reels.forEach((reel, idx) => {

        const slotStatus = document.getElementById('slotStatus');
        if (slotRevealInterval) clearInterval(slotRevealInterval);
        const actualizar = () => {
            const restante = Math.max(0, Math.ceil((revealAt - Date.now()) / 1000));
            if (restante <= 0) {
                clearInterval(slotRevealInterval);
                slotRevealInterval = null;
                slotStatus.innerText = '🎉 ¡RESULTADO LISTO! MOSTRANDO GANADOR...';
                return;
            }
            slotStatus.innerText = '🎰 NÚMERO PREMIADO · MOSTRANDO GANADOR EN ' +
                String(restante).padStart(2,'0') + ' s';
        };
        actualizar();
        slotRevealInterval = setInterval(actualizar, 250);
    }

    function calcularYEjecutarTirada(rawLinesStr, rawBlacklistStr, animarResultado = true) {
        const rawLines = rawLinesStr.split('\n');
        const rawBlacklist = rawBlacklistStr.split('\n');

        let participantesValidos = [];
        rawLines.forEach(function(line) {
            let lineaLimpia = line.trim();
            if (!lineaLimpia) return;
            const matchUser = lineaLimpia.match(/@[\w_]+/);
            if (matchUser) {
                let boletoLimpio = lineaLimpia.replace(/PUNTO\s+EXTRA\s*/gi, '').trim();
                participantesValidos.push({ ticket: boletoLimpio, user: matchUser[0] });
            }
        });

        const total = participantesValidos.length;
        if (total === 0) return;

        const blacklist = rawBlacklist.map(u => u.trim().toLowerCase()).filter(u => u.length > 0);

        let log = [];
        let ganadorEncontrado = null;
        let indexGanador = -1;
        let listaCopia = participantesValidos.slice();

        while (listaCopia.length > 0) {
            const indexAleatorio = obtenerIndiceCriptografico(listaCopia.length);
            const entrada = listaCopia[indexAleatorio];
            const usuarioMinusculas = entrada.user.toLowerCase();

            if (blacklist.indexOf(usuarioMinusculas) !== -1) {
                log.push("❌ Descartado: " + entrada.ticket + " (" + entrada.user + " está en la Lista Negra)");
                listaCopia.splice(indexAleatorio, 1);
            } else {
                ganadorEncontrado = entrada;
                indexGanador = participantesValidos.findIndex(p => p.ticket === entrada.ticket);
                log.push("✅ ¡TIRADA GANADORA!: " + entrada.ticket);
                break;
            }
        }

        if (!ganadorEncontrado) return;

        let anteriores = [], posteriores = [], usuariosUsados = {};
        usuariosUsados[ganadorEncontrado.user.toLowerCase()] = true;

        let curr = indexGanador - 1, cntAnt = 0;
        while (anteriores.length < 2 && cntAnt < total) {
            if (curr < 0) curr = total - 1;
            let cand = participantesValidos[curr];
            if (!usuariosUsados[cand.user.toLowerCase()]) {
                anteriores.unshift(cand);
                usuariosUsados[cand.user.toLowerCase()] = true;
            }
            curr--; cntAnt++;
        }

        curr = indexGanador + 1; let cntPost = 0;
        while (posteriores.length < 2 && cntPost < total) {
            if (curr >= total) curr = 0;
            let cand = participantesValidos[curr];
            if (!usuariosUsados[cand.user.toLowerCase()]) {
                posteriores.push(cand);
                usuariosUsados[cand.user.toLowerCase()] = true;
            }
            curr++; cntPost++;
        }

        const arcadeGroup = anteriores.concat([ganadorEncontrado], posteriores);
        const ahora = new Date();
        const fechaFormateada = `${nombresMeses[ahora.getMonth()]} ${ahora.getFullYear()}`;

        db.ref('historial_ganadores').push({
            user: ganadorEncontrado.user,
            ticket: ganadorEncontrado.ticket,
            fecha: fechaFormateada,
            timestamp: Date.now() + Math.random()
        });

        const resultadoData = {
            ganador: ganadorEncontrado,
            arcadeGroup: arcadeGroup,
            log: log,
            timestamp: Date.now()
        };

        if (animarResultado) {
            resultadoData.revealAt = Date.now() + SLOT_REVEAL_MS;
        }

        db.ref('sorteo_actual').set(resultadoData);
    }

    // ============================================================
    //  FUNCIÓN PARA OBTENER ÍNDICE CRIPTOGRÁFICO
    // ============================================================
    function obtenerIndiceCriptografico(max) {
        if (max <= 0) return 0;
        const arrayBuffer = new Uint32Array(1);
        const maxUint32 = 0xFFFFFFFF;
        const limiteEquitativo = maxUint32 - (maxUint32 % max);
        let valorRandom;
        do {
            window.crypto.getRandomValues(arrayBuffer);
            valorRandom = arrayBuffer[0];
        } while (valorRandom >= limiteEquitativo);
        return valorRandom % max;
    }

    // ============================================================
    //  FUNCIÓN PRINCIPAL DE PROGRAMACIÓN
    // ============================================================
    function programarOEjecutarSorteo() {
        const dateVal = document.getElementById('drawDateInput').value;
        const timeVal = document.getElementById('drawTimeInput').value;
        const rawLines = document.getElementById('listInput').value.trim();
        const rawBlacklist = document.getElementById('blacklistInput').value.trim();

        console.log("Fecha seleccionada:", dateVal);
        console.log("Hora seleccionada:", timeVal);

        if (!rawLines) return alert("Pega o importa la lista de participantes.");

        // Si NO hay hora seleccionada (cadena vacía o "--:--") → SORTEO INMEDIATO
        if (!timeVal || timeVal === "--:--" || timeVal.trim() === "") {
            if (confirm("El sorteo se realizará de inmediato. ¿Continuar?")) {
                detenerTragaperras();
                mostrarRecreativa(true);
                document.getElementById('slotStatus').innerText = '🎰 SORTEO INMEDIATO...';
                calcularYEjecutarTirada(rawLines, rawBlacklist, true);
            }
            return;
        }

        // Si hay hora, se programa
        const timeParts = timeVal.split(':');
        let targetDate = new Date();

        if (dateVal) {
            const dateParts = dateVal.split('-');
            targetDate.setFullYear(parseInt(dateParts[0], 10), parseInt(dateParts[1], 10) - 1, parseInt(dateParts[2], 10));
        }

        targetDate.setHours(parseInt(timeParts[0], 10), parseInt(timeParts[1], 10), 0, 0);

        // Si no hay fecha y la hora ya pasó, se programa para mañana
        if (!dateVal && targetDate.getTime() <= Date.now()) {
            targetDate.setDate(targetDate.getDate() + 1);
        }

        db.ref('sorteo_actual').set({
            status: 'programado',
            targetTime: targetDate.getTime(),
            rawLines: rawLines,
            rawBlacklist: rawBlacklist
        }).then(() => alert("¡Sorteo programado con éxito!"));
    }

    // ============================================================
    //  INICIALIZADORES DE SELECTORES (FECHA Y HORA)
    // ============================================================
    function initRetroDatePicker() {
        const input = document.getElementById("drawDateInput");
        const picker = document.getElementById("retroDatePicker");
        const display = document.getElementById("retroDateDisplay");
        const text = document.getElementById("retroDateDisplayValue");
        const panel = document.getElementById("retroDatePanel");
        const grid = document.getElementById("retroDateGrid");
        const label = document.getElementById("retroDateMonthLabel");
        const prev = document.getElementById("retroDatePrev");
        const next = document.getElementById("retroDateNext");
        const confirmBtn = document.getElementById("retroDateConfirm");
        const cancelBtn = document.getElementById("retroDateCancel");
        if (!input || !picker) return;

        const pad = n => String(n).padStart(2, "0");
        const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
        const now = new Date();
        let selected = null;
        let view = new Date(now.getFullYear(), now.getMonth(), 1);
        let previousValue = input.value || "";

        function parse(s) {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
            return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
        }

        function render() {
            label.textContent = view.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
            grid.innerHTML = "";
            const first = new Date(view.getFullYear(), view.getMonth(), 1);
            const start = (first.getDay() + 6) % 7;
            for (let i = 0; i < 42; i++) {
                const d = new Date(view.getFullYear(), view.getMonth(), i - start + 1);
                const b = document.createElement("button");
                b.type = "button";
                b.className = "retro-date-cell";
                if (d.getMonth() !== view.getMonth()) b.classList.add("other-month");
                if (iso(d) === iso(now)) b.classList.add("today");
                if (selected && iso(d) === iso(selected)) b.classList.add("selected");
                b.textContent = d.getDate();
                b.onclick = () => {
                    selected = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                    render();
                };
                grid.appendChild(b);
            }
        }

        display.onclick = e => {
            e.stopPropagation();
            previousValue = input.value || "";
            if (!selected) {
                selected = parse(input.value) || new Date();
                view = new Date(selected.getFullYear(), selected.getMonth(), 1);
            } else {
                view = new Date(selected.getFullYear(), selected.getMonth(), 1);
            }
            render();
            panel.classList.remove("hidden");
        };

        prev.onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
        next.onclick = () => { view.setMonth(view.getMonth() + 1); render(); };

        confirmBtn.onclick = () => {
            if (selected) {
                const val = iso(selected);
                input.value = val;
                text.textContent = pad(selected.getDate()) + "/" + pad(selected.getMonth() + 1) + "/" + selected.getFullYear();
                panel.classList.add("hidden");
            }
        };

        cancelBtn.onclick = () => {
            input.value = "";
            text.textContent = "--/--/----";
            selected = null;
            panel.classList.add("hidden");
        };

        document.addEventListener("click", e => {
            if (!picker.contains(e.target) && !panel.classList.contains("hidden")) {
                if (selected) {
                    const val = iso(selected);
                    input.value = val;
                    text.textContent = pad(selected.getDate()) + "/" + pad(selected.getMonth() + 1) + "/" + selected.getFullYear();
                }
                panel.classList.add("hidden");
            }
        });

        const old = parse(input.value);
        if (old) text.textContent = pad(old.getDate()) + "/" + pad(old.getMonth() + 1) + "/" + old.getFullYear();
        else text.textContent = "--/--/----";
    }

    function initRetroTimePicker() {
        const valueInput = document.getElementById("drawTimeInput");
        const display = document.getElementById("retroTimeDisplay");
        const displayValue = document.getElementById("retroTimeDisplayValue");
        const panel = document.getElementById("retroTimePanel");
        const hourWheel = document.getElementById("retroHourWheel");
        const minuteWheel = document.getElementById("retroMinuteWheel");
        const confirmBtn = document.getElementById("retroTimeConfirm");
        const cancelBtn = document.getElementById("retroTimeCancel");
        const picker = document.getElementById("retroTimePicker");
        if (!valueInput || !display || !displayValue || !panel || !hourWheel || !minuteWheel || !confirmBtn || !picker) return;

        let hour = 0, minute = 0;
        let hasSelected = false;
        let previousValue = valueInput.value || "";
        const pad = n => String(n).padStart(2, "0");

        function renderWheel(element, max, selectedVal, onSelect) {
            element.innerHTML = "";
            for (let n = 0; n <= max; n++) {
                const item = document.createElement("div");
                item.className = "retro-time-option" + (n === selectedVal ? " selected" : "");
                item.dataset.value = String(n);
                item.textContent = pad(n);
                item.addEventListener("click", () => {
                    onSelect(n);
                    render();
                });
                element.appendChild(item);
            }
            requestAnimationFrame(() => {
                const selectedItem = element.querySelector(".selected");
                if (selectedItem) {
                    element.scrollTop = selectedItem.offsetTop - (element.clientHeight - selectedItem.offsetHeight) / 2;
                }
            });
        }

        function render() {
            renderWheel(hourWheel, 23, hour, n => hour = n);
            renderWheel(minuteWheel, 59, minute, n => minute = n);
            if (hasSelected) {
                const value = pad(hour) + ":" + pad(minute);
                displayValue.textContent = value;
                valueInput.value = value;
            }
        }

        function setFromCurrentTime() {
            const now = new Date();
            hour = now.getHours();
            minute = now.getMinutes();
            hasSelected = true;
        }

        display.addEventListener("click", event => {
            event.stopPropagation();
            previousValue = valueInput.value || "";
            if (!hasSelected) setFromCurrentTime();
            else {
                const match = /^(\d{2}):(\d{2})$/.exec(valueInput.value || "");
                if (match) {
                    hour = Number(match[1]);
                    minute = Number(match[2]);
                    hasSelected = true;
                } else {
                    setFromCurrentTime();
                }
            }
            render();
            panel.classList.remove("hidden");
            display.setAttribute("aria-expanded", "true");
        });

        confirmBtn.addEventListener("click", () => {
            if (!hasSelected) setFromCurrentTime();
            const value = pad(hour) + ":" + pad(minute);
            displayValue.textContent = value;
            valueInput.value = value;
            valueInput.dataset.userSelected = "true";
            panel.classList.add("hidden");
            display.setAttribute("aria-expanded", "false");
        });

        cancelBtn.addEventListener("click", () => {
            valueInput.value = "";
            displayValue.textContent = "--:--";
            hasSelected = false;
            panel.classList.add("hidden");
            display.setAttribute("aria-expanded", "false");
        });

        hourWheel.addEventListener("wheel", e => {
            e.preventDefault();
            if (!hasSelected) setFromCurrentTime();
            hour = (hour + (e.deltaY > 0 ? 1 : -1) + 24) % 24;
            render();
        }, { passive: false });

        minuteWheel.addEventListener("wheel", e => {
            e.preventDefault();
            if (!hasSelected) setFromCurrentTime();
            minute = (minute + (e.deltaY > 0 ? 1 : -1) + 60) % 60;
            render();
        }, { passive: false });

        hourWheel.addEventListener("keydown", e => {
            if (e.key === "ArrowDown") { e.preventDefault(); if (!hasSelected) setFromCurrentTime(); hour = (hour + 1) % 24; render(); }
            if (e.key === "ArrowUp") { e.preventDefault(); if (!hasSelected) setFromCurrentTime(); hour = (hour - 1 + 24) % 24; render(); }
        });

        minuteWheel.addEventListener("keydown", e => {
            if (e.key === "ArrowDown") { e.preventDefault(); if (!hasSelected) setFromCurrentTime(); minute = (minute + 1) % 60; render(); }
            if (e.key === "ArrowUp") { e.preventDefault(); if (!hasSelected) setFromCurrentTime(); minute = (minute - 1 + 60) % 60; render(); }
        });

        document.addEventListener("click", e => {
            if (!picker.contains(e.target)) {
                panel.classList.add("hidden");
                display.setAttribute("aria-expanded", "false");
            }
        });

        displayValue.textContent = "--:--";
        valueInput.value = "";
    }

    console.log("✅ Web cargada con Firebase Auth integrado. Acceso admin protegido.");
</script>
